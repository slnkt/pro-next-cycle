<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioniq PRO — запуск следующего цикла (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1098D4;
  --blue-light:#63BCE3;
  --dark:#05131A;
  --muted:#8A9096;
  --bg:#F2F3F5;
  --field:#F3F4F6;
  --accent-bg:#EDF8FC;
  --line:#E6E8EB;
  --green:#27AE60;
  --error:#d10714;
  --radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Montserrat",Arial,Helvetica,sans-serif;
  font-size:14px;color:var(--dark);
  background:#fafafa;min-height:100vh;
}
button,input,textarea{font-family:inherit;color:inherit}
[hidden]{display:none !important}
svg{display:block}

/* ================= page ================= */
.wrap{max-width:960px;margin:0 auto;padding:32px 16px 80px}
.title{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.title .logo{height:22px;width:auto;fill:var(--dark)}
.title h1{font-size:20px;font-weight:600}
.title span{font-size:13px;color:var(--muted)}

.panel{
  background:#fff;border-radius:var(--radius);
  padding:18px 20px;margin-bottom:28px;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;
  box-shadow:0 2px 12px rgba(5,19,26,.05);
}
.pgroup label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:.02em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  border:1.5px solid var(--line);background:#fff;border-radius:22px;
  padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg button:disabled{opacity:.4;cursor:default}
.phint{font-size:11.5px;color:var(--muted);margin-top:6px;min-height:14px}
.pactions{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.pbtn{
  border:0;border-radius:22px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;
  background:linear-gradient(90deg,var(--blue),var(--blue-light));color:#fff;
  transition:transform .12s,opacity .15s;
}
.pbtn:active{transform:scale(.97)}
.pbtn:disabled{background:var(--field);color:var(--muted);cursor:default}
.pbtn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--dark)}
.stage-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.stage-nav span{font-size:12.5px;font-weight:600;min-width:120px;text-align:center}
.stage-nav button{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.stage-nav button:disabled{opacity:.35;cursor:default}
@media(max-width:640px){.panel{grid-template-columns:1fr}.stage-nav{margin-left:0;width:100%}}

/* ================= phone ================= */
.phone-wrap{display:flex;justify-content:center}
.phone{
  width:390px;height:844px;flex:none;
  border-radius:56px;background:#0b0b0b;padding:10px;
  box-shadow:0 30px 70px rgba(5,19,26,.28),inset 0 0 0 2px #2a2a2a;
  position:relative;
}
.screen{width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg);position:relative}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;border-radius:20px;background:#000;z-index:20}
.sbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:15;
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 34px;
  font-size:15px;font-weight:600;
}
.sbar .ic{display:flex;align-items:center;gap:6px}
.screen.lock .sbar{color:#fff}
.screen:not(.lock) .sbar{background:linear-gradient(var(--bg) 72%,rgba(242,243,245,0))}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--dark);z-index:30;opacity:.9}
.screen.lock .homebar{background:#fff}

.app{position:absolute;inset:0;overflow-y:auto;padding:58px 14px 110px;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}

/* header (как в приложении) */
.hdr{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
.hdr .logo{height:22px;width:auto;fill:var(--dark)}
.hdr .right{display:flex;align-items:center;gap:8px}
.icbtn{width:40px;height:40px;border-radius:50%;background:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.icbtn .bd{position:absolute;top:-4px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* stories */
.stories{display:flex;gap:8px;overflow:hidden;margin:0 -14px 14px;padding:0 14px}
.story{flex:none;width:110px;height:82px;border-radius:14px;position:relative;overflow:hidden}
.story span{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 8px;font-size:11.5px;font-weight:600;color:#fff;text-align:right;line-height:1.2;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.story.s1{background:radial-gradient(circle at 30% 30%,#8FB9D6,#2E5C7A 70%)}
.story.s2{background:radial-gradient(circle at 60% 40%,#F0B36B,#B5541E 75%)}
.story.s3{background:radial-gradient(circle at 40% 30%,#E5D3C0,#8C6B55 75%)}
.story.s4{width:16px;background:linear-gradient(180deg,var(--blue),var(--blue-light))}

/* program card */
.pcard{background:#fff;border:1px dashed var(--dark);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.tag{display:flex;align-items:center;justify-content:space-between;background:var(--field);border-radius:30px;padding:8px 8px 8px 16px;margin-bottom:14px}
.tag b{display:block;font-size:12px;font-weight:700;letter-spacing:.03em}
.tag span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.tag .chev{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.bar{height:6px;border-radius:3px;background:var(--line);margin:0 2px 18px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .4s}
.srow{display:flex;gap:14px;padding:0 2px}
.srow + .srow{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.srow .ico{flex:none;width:48px;height:48px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center}
.srow .ico.ava{background:linear-gradient(135deg,var(--blue),var(--blue-light));color:#fff;font-size:13px;font-weight:600}
.srow .body{flex:1;min-width:0}
.srow h2{font-size:19px;font-weight:600;line-height:1.22}
.srow .sub{font-size:14.5px;line-height:1.4;margin-top:4px}
.srow .sub b{font-weight:600}
.lnk{background:none;border:0;padding:0;font-size:14.5px;font-weight:600;color:var(--blue);cursor:pointer;display:inline-block;margin-top:12px}
.lnk.sm{font-size:13px;margin-top:8px;margin-right:14px}
.note{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.4}
.btn{
  border:0;border-radius:26px;height:50px;padding:0 28px;font-size:15.5px;font-weight:600;cursor:pointer;
  background:linear-gradient(90deg,var(--blue-light),var(--blue));color:#fff;
  transition:transform .12s;display:inline-flex;align-items:center;justify-content:center;
}
.btn:active{transform:scale(.97)}
.btn.full{width:100%}
.btn.sec{background:var(--field);color:var(--dark)}
.btn.white{background:#fff;color:var(--dark)}
.srow .btn{margin-top:14px}

/* intake (тёмная карточка, как в приложении) */
.icard{background:#fff;border-radius:var(--radius);padding:0 14px 6px;margin-bottom:12px;overflow:hidden}
.dark{
  margin:0 -14px 12px;padding:16px;height:170px;border-radius:var(--radius);
  background:radial-gradient(90% 120% at 85% 110%,#1D7FB3 0%,#0C3A52 38%,#061620 70%,#050C10 100%);
  color:#fff;display:flex;flex-direction:column;justify-content:space-between;
}
.dark .dtag{align-self:flex-start;background:rgba(255,255,255,.16);border-radius:20px;padding:8px 12px;font-size:11px;font-weight:700;letter-spacing:.03em}
.dark .drow{display:flex;align-items:center;justify-content:space-between}
.dark .days{font-size:34px;font-weight:400;line-height:1}
.sh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:4px 2px 12px}
.sh .chev{width:20px;height:20px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center}
.cal{display:flex;justify-content:space-between;margin-bottom:18px}
.cal .d{flex:1;text-align:center;padding:6px 0 8px;border-radius:10px;font-size:12px;font-weight:600}
.cal .d span{display:block;font-size:14.5px;margin:3px 0 8px}
.cal .d.past{color:var(--dark)}
.cal .d.today{background:var(--accent-bg)}
.cal .d.fut{color:#B9BEC4}
.cal .d svg{margin:0 auto}
.left{display:flex;gap:6px;margin-bottom:6px}
.left .col{flex:1;background:var(--field);border-radius:14px;padding:12px 10px}
.left .num{font-size:22px;font-weight:600;line-height:1}
.left .num small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.left .lab{font-size:11px;color:var(--muted);margin-top:4px}
.left .col.bump .num{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.icard .srow{padding:16px 2px 12px;margin-top:6px;border-top:1px solid var(--line)}
.pcard .sh.left-h{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

/* analytics / recs (как в приложении) */
.card{background:#fff;border-radius:var(--radius);padding:16px 14px;margin-bottom:12px}
.mk{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mk b{display:block;font-size:14.5px;font-weight:600}
.mk span{font-size:13.5px}
.chip{display:inline-flex;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:12px;padding:5px 10px;background:#E8F7EE;color:#1F8F4E;margin-top:4px}
.range{position:relative;height:1px;background:var(--dark);margin:16px 0 14px;width:50%}
.range i{position:absolute;right:-6px;top:-12px;border:6px solid transparent;border-top:8px solid var(--green)}
.gbox{background:var(--field);border-radius:14px;padding:14px}
.gbox small{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.gbox p{font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dots{display:flex;justify-content:center;gap:5px;margin-top:12px}
.dots i{width:5px;height:5px;border-radius:50%;background:#C9CDD2}
.dots i:first-child{background:var(--dark)}
.rec{font-size:14.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdate{font-size:12.5px;color:var(--muted);text-align:right;margin-top:10px}
.card.col{padding:14px}
.card.col .sh{margin:0}
.disc{font-size:10.5px;line-height:1.4;color:var(--muted);padding:0 2px 8px}

/* tabbar */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:88px;z-index:12;
  background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:10px 10px 0;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:#5C6470;background:none;border:0;cursor:pointer;width:72px}
.tab svg{stroke:#5C6470}
.tab.on{color:var(--blue)}
.tab.on svg{stroke:var(--blue)}

/* ================= lock ================= */
.lock{
  position:absolute;inset:0;
  background:radial-gradient(120% 70% at 30% 0%,#1B5E86 0%,#0B2A3C 45%,#05131A 100%);
  color:#fff;display:flex;flex-direction:column;align-items:center;padding:92px 18px 60px;
}
.lock .date{font-size:16px;font-weight:500;opacity:.9}
.lock .time{font-size:82px;font-weight:500;letter-spacing:-1px;line-height:1.05;margin-bottom:30px}
.notif{
  width:100%;border-radius:22px;padding:12px 14px;background:rgba(255,255,255,.92);color:var(--dark);
  display:flex;gap:12px;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.25);
  transform:translateY(-14px);opacity:0;animation:drop .45s .15s ease forwards;
}
@keyframes drop{to{transform:none;opacity:1}}
.notif .appic{flex:none;width:40px;height:40px;border-radius:11px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.notif .body{flex:1;min-width:0}
.notif .l1{display:flex;justify-content:space-between;font-size:11.5px;color:#5c6d78;margin-bottom:2px}
.notif .l1 b{font-weight:600;color:var(--dark)}
.notif .t{font-size:13px;font-weight:600;line-height:1.3}
.notif .d{font-size:12.5px;line-height:1.4;color:#3f5361;margin-top:2px}
.lock .hint{margin-top:auto;font-size:12.5px;opacity:.75;background:none;border:0;color:#fff;cursor:pointer;padding:10px}
.lock .flash{position:absolute;bottom:88px;left:0;right:0;display:flex;justify-content:space-between;padding:0 46px}
.lock .flash span{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}

/* ================= sheet ================= */
.dim{position:absolute;inset:0;background:rgba(5,19,26,.45);z-index:40;opacity:0;transition:opacity .25s}
.dim.show{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;
  background:#fff;border-radius:28px 28px 0 0;padding:10px 18px 36px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-height:92%;overflow-y:auto;
}
.sheet.show{transform:none}
.handle{width:48px;height:5px;border-radius:3px;background:#D5D8DC;margin:0 auto 20px}
.step-cap{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.sheet h3{font-size:23px;font-weight:600;line-height:1.2;margin-bottom:10px}
.sheet p{font-size:14.5px;line-height:1.45;margin-bottom:18px}
.sheet .btn{margin-bottom:10px}
.addr{display:flex;gap:12px;align-items:flex-start;background:var(--field);border-radius:14px;padding:14px;margin-bottom:18px}
.addr .txt b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.addr .txt span{font-size:13.5px;line-height:1.4}
.ta{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;resize:none;height:84px;outline:none;margin-bottom:14px}
.ta:focus{border-color:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.chips-cap{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.done-ic{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--blue-light),var(--blue));display:flex;align-items:center;justify-content:center;margin:6px 0 16px}
.sum{border-radius:14px;background:var(--field);padding:4px 14px;margin-bottom:18px}
.sum div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:10px 0;border-top:1px solid #fff}
.sum div:first-child{border-top:0}
.sum span{color:var(--muted)}
.sum b{font-weight:600;text-align:right}

/* ================= form (stub) ================= */
.form{position:absolute;inset:0;background:var(--bg);z-index:45;overflow-y:auto;padding:64px 14px 40px;scrollbar-width:none}
.form .fh{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.form .fh h2{font-size:22px;font-weight:600}
.fld{background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.fld label{font-size:14px;font-weight:500}
.fld input{border:0;text-align:right;font-size:14px;font-weight:600;width:110px;outline:none}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(18px)}
.fld.col2{flex-direction:column;align-items:stretch}
.fld.col2 textarea{border:0;outline:none;font-size:14px;line-height:1.45;resize:none;height:70px;margin-top:6px}

.toast{
  position:absolute;left:14px;right:14px;bottom:100px;z-index:50;
  background:var(--dark);color:#fff;border-radius:16px;padding:12px 16px;
  font-size:12.5px;font-weight:500;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:none}
</style>
</head>

function tariff(){ return TARIFFS[S.tariff]; }
function defaultCheckup(){ return tariff().chk.includes(S.cycle) ? 1 : 0; }
function usedCheckupsBefore(){ return tariff().chk.filter(c => c < S.cycle).length; }
function checkupsLeftBeforeLaunch(){ return tariff().checkups - usedCheckupsBefore(); }
function counters(){
  const t = tariff();
  const done = S.launched ? 1 : 0;
  const chkUsed = usedCheckupsBefore() + (S.launched && S.checkup ? 1 : 0);
  return {
    complexes:[Math.max(0, t.complexes - (S.cycle - 1) - done), t.complexes],
    checkups:[Math.max(0, t.checkups - chkUsed), t.checkups],
    consults:[Math.max(0, t.consults - chkUsed), t.consults],
  };
}

  if (S.screen === 'lock') html += renderLock();
  else {
    html += renderHome();
    if (S.screen === 'form') html += renderForm();
    if (S.sheet) html += `<div class="dim" id="dim"></div><div class="sheet" id="sheet">${renderSheet()}</div>`;
  }
  html += `<div class="toast" id="toast"></div><div class="homebar"></div>`;
  screen.innerHTML = html;
  const app = screen.querySelector('.app');
  if (app) app.scrollTop = scrollPos;
  if (S.sheet) requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('dim').classList.add('show');
    document.getElementById('sheet').classList.add('show');
  }));
  S.bump = false;
  renderPanel();
}

function leftBlock(inPcard){
  const c = counters(); const b = S.bump ? ' bump' : '';
  return `<div class="sh${inPcard ? ' left-h' : ''}">Осталось по программе</div>
  <div class="left">
    <div class="col${b}"><div class="num">${c.complexes[0]}<small>из ${c.complexes[1]}</small></div><div class="lab">Комплексов</div></div>
    <div class="col${b}"><div class="num">${c.checkups[0]}<small>из ${c.checkups[1]}</small></div><div class="lab">Чекапов</div></div>
    <div class="col${b}"><div class="num">${c.consults[0]}<small>из ${c.consults[1]}</small></div><div class="lab">Консультаций</div></div>
  </div>`;
}

function calendar(){
  const days = [['вс',20,'past'],['пн',21,'past'],['вт',22,'past'],['ср',23,'past'],['чт',24,'today'],['пт',25,'fut'],['сб',26,'fut']];
  return `<div class="sh">Календарь <span class="chev">${I.chev}</span></div>
  <div class="cal">${days.map(([d, n, k]) => `<div class="d ${k}">${d}<span>${n}</span>${k === 'past' ? I.check : k === 'today' ? I.dot : I.lockI}</div>`).join('')}</div>`;
}

function tagRow(){
  return `<div class="tag"><div><b>${tariff().tag}</b><span>${ORDER}</span></div><div class="chev">${I.chevD}</div></div>`;
}

function statusRow(st, iconKey){
  let h = `<div class="srow"><div class="ico">${I[iconKey || 'list']}</div><div class="body">
    <h2>${st.t}</h2>${st.sub ? `<div class="sub">${st.sub}</div>` : ''}`;
  if (st.kind === 'ask') h += `<div><button class="btn" data-act="gotIt">Подтвердить</button></div><div><button class="lnk" data-act="notYet">Сообщить о проблеме</button></div>`;
  else if (st.link) h += `<div><button class="lnk">${st.link}</button></div>`;
  if (st.note) h += `<div class="note">${st.note}</div>`;
  return h + `</div></div>`;
}

function intakeCard(days, extra){
  return `<div class="icard">
    <div class="dark"><div class="dtag">${tariff().tag}</div><div class="drow"><div class="days">${days}</div><button class="btn">Принять</button></div></div>
    ${calendar()}
    ${leftBlock(false)}
    ${extra || ''}
  </div>`;
}

function programCard(){
  if (!S.launched){
    const extra = S.pushed ? `<div class="srow"><div class="ico">${I.list}</div><div class="body">
      <h2>Пора заказать следующий комплекс</h2>
      <div class="sub">Витаминов хватит до 24 октября. Производство и доставка занимают около месяца, закажите сейчас, чтобы не делать перерыв</div>
      <div><button class="btn" data-act="openOrder">Заказать</button></div></div></div>` : '';
    return intakeCard(30, extra);
  }
  const st = stages(), cur = st[S.stage];
  if (cur.ok) return intakeCard(90);
  const pct = Math.round(((S.stage + 1) / st.length) * 100);
  let h = `<div class="pcard">${tagRow()}<div class="bar"><i style="width:${pct}%"></i></div>`;
  h += statusRow(cur);
  if (cur.second) h += statusRow(cur.second, cur.second.icon);
  if (S.launch === 'manager' && S.stage < 2) h += `<div class="srow"><div class="ico ava">АК</div><div class="body">
    <h2>Следующий цикл запустила ваш менеджер Алина</h2>
    <div class="sub">Комплекс №${S.cycle} уже в работе. Доставим по адресу: ${S.addr}</div>
    <div><button class="lnk sm" data-act="editAddr">Изменить адрес</button>${S.checkup && !S.date && S.stage === 0 ? `<button class="lnk sm" data-act="pickDate">Выбрать дату забора крови</button>` : ''}</div>
  </div></div>`;
  h += leftBlock(true) + `</div>`;
  return h;
}

function renderHome(){
  return `<div class="app">
    <div class="hdr"><svg class="logo" viewBox="0 0 299.6 82.4"><use href="#wm"/></svg>
      <div class="right"><button class="icbtn">${I.user}</button><button class="icbtn">${I.chat}<span class="bd">3</span></button><button class="icbtn">${I.basket}</button></div></div>
    <div class="stories">
      <div class="story s1"><span>О нас</span></div>
      <div class="story s2"><span>Гранулы</span></div>
      <div class="story s3"><span>Реферальная программа</span></div>
      <div class="story s4"></div>
    </div>

    ${programCard()}

    <div class="card">
      <div class="sh">Аналитика <span class="chev">${I.chev}</span></div>
      <div class="mk"><div><b>Витамин D</b><span>46 нг/мл</span></div><span class="chip">В норме</span></div>
      <div class="range"><i></i></div>
      <div class="gbox"><small>Что может значить?</small><p>Витамин D участвует в усвоении кальция и работе иммунной системы. Уровень выше 30 нг/мл считается достаточным, ваш результат в целевом диапазоне.</p></div>
      <div class="dots"><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="card">
      <div class="sh">Рекомендация <span class="chev">${I.chev}</span></div>
      <div class="rec">Принимать формулу Bioniq PRO по 2 капсулы утром во время еды</div>
      <div class="rdate">24 сентября 2026</div>
    </div>

    <div class="card col"><div class="sh">Инструкция по приему <span class="chev">${I.chev}</span></div></div>

    <div class="disc">Приложение агрегирует результаты лабораторных исследований от лицензированных партнёров и предоставляет общие рекомендации для поддержания здоровья и благополучия. Оно не осуществляет медицинскую диагностику и не предоставляет лечение. Все медицинские услуги выполняются партнёрскими лабораториями, имеющими действующие лицензии.</div>
  </div>
  <div class="tabbar">
    <button class="tab on">${tabIcon.home}Главная</button>
    <button class="tab">${tabIcon.an}Аналитика</button>
    <button class="tab">${tabIcon.mat}Материалы</button>
    <button class="tab">${tabIcon.shop}Витрина</button>
  </div>`;
}

function renderLock(){
  return `<div class="lock">
    <div class="date">Четверг, 24 сентября</div>
    <div class="time">9:41</div>
    <div class="notif" data-act="openPush">
      <div class="appic">${I.sign}</div>
      <div class="body">
        <div class="l1"><b>Bioniq</b><span>сейчас</span></div>
        <div class="t">Пора заказать следующий комплекс</div>
        <div class="d">Витаминов хватит ещё на месяц. Производство и доставка занимают столько же, поэтому лучше заказать сейчас.</div>
      </div>
    </div>
    <div class="flash"><span>${I.torch}</span><span>${I.cam}</span></div>
    <button class="hint" data-act="unlock">Смахните вверх, чтобы открыть</button>
  </div>`;
}

function sheetSteps(){
  if (S.sheetMode === 'addr') return ['address'];
  if (S.sheetMode === 'blood') return ['blood'];
  const s = ['anketa','address'];
  if (S.checkup) s.push('blood');
  s.push('done');
  return s;
}

function renderSheet(){
  const steps = sheetSteps();
  const step = steps[S.step];
  const total = steps.length - (steps.includes('done') ? 1 : 0);
  const cap = S.sheetMode === 'full' && step !== 'done' ? `<div class="step-cap">Шаг ${S.step + 1} из ${total}</div>` : '';
  let h = `<div class="handle"></div>${cap}`;
  if (step === 'anketa'){
    h += `<h3>Что-то изменилось в анкете здоровья?</h3>
      <p>Новые диагнозы, лекарства, беременность или самочувствие. Врач учтёт это, когда будет собирать формулу.</p>
      <button class="btn full" data-act="anketaNo">Нет, всё как прежде</button>
      <button class="btn full sec" data-act="anketaYes">Да, обновить анкету</button>`;
  } else if (step === 'address'){
    h += `<h3>Подтвердите адрес доставки</h3>`;
    if (S.editAddr){
      h += `<p>Курьер привезёт комплекс сюда.</p>
        <textarea class="ta" id="addrIn">${S.addr}</textarea>
        <button class="btn full" data-act="saveAddr">Сохранить адрес</button>`;
    } else {
      h += `<p>Курьер привезёт комплекс на прежний адрес.</p>
        <div class="addr">${I.pin}<div class="txt"><b>Дом</b><span>${S.addr}</span></div></div>
        <button class="btn full" data-act="confirmAddr">Подтвердить</button>
        <button class="btn full sec" data-act="editAddrInline">Изменить</button>`;
    }
  } else if (step === 'blood'){
    h += `<h3>Запишитесь на забор крови</h3>
      <p>Медсестра приедет домой или в офис, процедура занимает около десяти минут.</p>
      <div class="chips-cap">Дата</div>
      <div class="chips">${DATES.map((d, i) => `<button class="${i === S.dSel ? 'on' : ''}" data-act="dSel" data-i="${i}">${d}</button>`).join('')}</div>
      <div class="chips-cap">Время</div>
      <div class="chips">${TIMES.map((d, i) => `<button class="${i === S.tSel ? 'on' : ''}" data-act="tSel" data-i="${i}">${d}</button>`).join('')}</div>
      <button class="btn full" data-act="book">Записаться на ${DATES[S.dSel]}</button>`;
  } else if (step === 'done'){
    h += `<div class="done-ic">${I.checkW}</div>
      <h3>Комплекс №${S.cycle} в работе</h3>
      <p>${S.checkup ? 'Сначала обновим анализы, затем врач соберёт формулу и мы запустим производство.' : 'Запускаем производство по вашей формуле. Комплекс приедет примерно через месяц.'}</p>
      <div class="sum">
        <div><span>Анкета</span><b>${S.anketa}</b></div>
        <div><span>Адрес</span><b>${S.addr}</b></div>
        ${S.checkup ? `<div><span>Забор крови</span><b>${S.date}, ${S.time}</b></div>` : ''}
      </div>
      <button class="btn full" data-act="finish">Вернуться на главную</button>`;
  }
  return h;
}

function renderForm(){
  return `<div class="form">
    <div class="fh"><button class="icbtn" data-act="formBack">${I.back}</button><h2>Анкета здоровья</h2></div>
    <div class="fld"><label>Вес</label><input value="58 кг"></div>
    <div class="fld"><label>Принимаю лекарства</label><button class="sw ${S.form.meds ? 'on' : ''}" data-act="swMeds"></button></div>
    <div class="fld"><label>Беременность или кормление</label><button class="sw ${S.form.preg ? 'on' : ''}" data-act="swPreg"></button></div>
    <div class="fld"><label>Аллергии</label><input value="Нет"></div>
    <div class="fld col2"><label>Что изменилось за последние месяцы</label><textarea placeholder="Самочувствие, сон, питание, новые диагнозы"></textarea></div>
    <div style="margin-top:14px"><button class="btn full" data-act="formSave">Сохранить</button></div>
  </div>`;
}

/* ================= panel ================= */
function renderPanel(){
  document.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.key;
    seg.querySelectorAll('button').forEach(b => {
      b.classList.toggle('on', String(S[key]) === b.dataset.v);
      if (key === 'cycle') b.disabled = Number(b.dataset.v) > tariff().cycles;
      if (key === 'checkup') b.disabled = (b.dataset.v === '1' && checkupsLeftBeforeLaunch() === 0);
    });
  });
  document.getElementById('hintCycle').textContent = tariff().cycles === 2 ? 'В тарифе на 6 месяцев два комплекса, второй и последний' : '';
  document.getElementById('hintChk').textContent = checkupsLeftBeforeLaunch() === 0 ? 'Чекапы по тарифу уже использованы' : (defaultCheckup() ? 'По плану тарифа в этом цикле чекап' : 'По плану тарифа в этом цикле чекапа нет');
  const push = document.getElementById('btnPush');
  push.hidden = S.launch === 'manager' || S.launched;
  push.disabled = S.pushed;
  push.textContent = S.pushed ? 'Пуш отправлен, повторно не беспокоим' : 'Прислать пуш за месяц до конца';
  const nav = document.getElementById('stageNav');
  nav.hidden = !S.launched;
  if (S.launched){
    const st = stages();
    document.getElementById('stLabel').textContent = `Этап ${S.stage + 1} из ${st.length}`;
    document.getElementById('stPrev').disabled = S.stage === 0;
    document.getElementById('stNext').disabled = S.stage === st.length - 1;
  }
}

function resetFlow(){
  Object.assign(S, {pushed:false, launched:false, stage:-1, screen:'home', sheet:null, sheetMode:'full', step:0, editAddr:false, addr:ADDR0, anketa:'без изменений', date:null, time:null, dSel:0, tSel:0, form:{meds:false, preg:false}});
  if (S.launch === 'manager'){ S.launched = true; S.stage = 0; }
  scrollPos = 0;
}

document.getElementById('panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const seg = b.closest('.seg');
  if (seg){
    const key = seg.dataset.key, v = b.dataset.v;
    if (key === 'tariff'){ S.tariff = v; if (S.cycle > tariff().cycles) S.cycle = 2; S.checkup = defaultCheckup(); }
    else if (key === 'cycle'){ S.cycle = Number(v); S.checkup = defaultCheckup(); }
    else if (key === 'checkup'){ S.checkup = Number(v); }
    else if (key === 'launch'){ S.launch = v; }
    if (checkupsLeftBeforeLaunch() === 0) S.checkup = 0;
    resetFlow(); render(); return;
  }
  if (b.id === 'btnPush'){ S.pushed = true; S.screen = 'lock'; render(); }
  if (b.id === 'btnReset'){ resetFlow(); render(); }
  if (b.id === 'stPrev'){ S.stage = Math.max(0, S.stage - 1); render(); }
  if (b.id === 'stNext'){ S.stage = Math.min(stages().length - 1, S.stage + 1); render(); }
});

/* ================= phone actions ================= */
function toast(msg){
  const t = document.getElementById('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function closeSheet(){
  const d = document.getElementById('dim'), s = document.getElementById('sheet');
  if (d) d.classList.remove('show'); if (s) s.classList.remove('show');
  setTimeout(() => { S.sheet = null; S.step = 0; S.editAddr = false; render(); }, 260);
}
function next(){
  const steps = sheetSteps();
  if (S.step < steps.length - 1){ S.step++; S.editAddr = false; render(); }
  else closeSheet();
}

screen.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const app = screen.querySelector('.app'); if (app) scrollPos = app.scrollTop;
  const a = el.dataset.act;
  switch (a){
    case 'openPush': S.screen = 'home'; scrollPos = 0; render(); setTimeout(() => { S.sheet = true; S.sheetMode = 'full'; S.step = 0; render(); }, 350); break;
    case 'unlock': S.screen = 'home'; scrollPos = 0; render(); break;
    case 'openOrder': S.sheet = true; S.sheetMode = 'full'; S.step = 0; render(); break;
    case 'anketaNo': S.anketa = 'без изменений'; next(); break;
    case 'anketaYes': S.screen = 'form'; render(); break;
    case 'formBack': S.screen = 'home'; render(); break;
    case 'formSave': S.anketa = 'обновлена'; S.screen = 'home'; next(); break;
    case 'swMeds': S.form.meds = !S.form.meds; render(); break;
    case 'swPreg': S.form.preg = !S.form.preg; render(); break;
    case 'editAddrInline': S.editAddr = true; render(); break;
    case 'saveAddr': { const v = document.getElementById('addrIn').value.trim(); if (v) S.addr = v; S.editAddr = false; if (S.sheetMode === 'addr'){ closeSheet(); setTimeout(() => toast('Адрес обновили, менеджер увидит его в заказе'), 320); } else next(); break; }
    case 'confirmAddr': next(); break;
    case 'dSel': S.dSel = Number(el.dataset.i); render(); break;
    case 'tSel': S.tSel = Number(el.dataset.i); render(); break;
    case 'book': S.date = DATES[S.dSel]; S.time = TIMES[S.tSel]; if (S.sheetMode === 'blood'){ closeSheet(); setTimeout(() => toast(`Записали на ${S.date}, ${S.time}`), 320); } else next(); break;
    case 'finish': S.launched = true; S.stage = 0; S.bump = true; closeSheet(); break;
    case 'gotIt': S.stage = stages().length - 1; scrollPos = 0; render(); break;
    case 'notYet': toast('Напишите в чат, менеджер поможет'); break;
    case 'editAddr': S.sheet = true; S.sheetMode = 'addr'; S.step = 0; S.editAddr = true; render(); break;
    case 'pickDate': S.sheet = true; S.sheetMode = 'blood'; S.step = 0; render(); break;
  }
});

S.checkup = defaultCheckup();
render();
</script>
</body>
</html>
