<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioniq PRO — запуск следующего цикла (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1098D4;
  --blue-light:#63BCE3;
  --dark:#05131A;
  --muted:#7D919D;
  --bg:#ECF3F8;
  --field:#F3F6F9;
  --accent-bg:#EDF8FC;
  --line:#DCE9F1;
  --green:#27AE60;
  --error:#d10714;
  --radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Montserrat",Arial,Helvetica,sans-serif;
  font-size:14px;color:var(--dark);
  background:#fafafa;min-height:100vh;
}
button,input,textarea{font-family:inherit;color:inherit}
[hidden]{display:none !important}
svg{display:block}

/* ================= page ================= */
.wrap{max-width:960px;margin:0 auto;padding:32px 16px 80px}
.title{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.title .logo{height:22px;width:auto;fill:var(--dark)}
.title h1{font-size:20px;font-weight:600}
.title span{font-size:13px;color:var(--muted)}

/* panel */
.panel{
  background:#fff;border-radius:var(--radius);
  padding:18px 20px;margin-bottom:28px;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;
  box-shadow:0 2px 12px rgba(5,19,26,.05);
}
.pgroup label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:.02em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  border:1.5px solid var(--line);background:#fff;border-radius:22px;
  padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg button:disabled{opacity:.4;cursor:default}
.phint{font-size:11.5px;color:var(--muted);margin-top:6px;min-height:14px}
.pactions{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.pbtn{
  border:0;border-radius:22px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;
  background:linear-gradient(90deg,var(--blue),var(--blue-light));color:#fff;
  transition:transform .12s,opacity .15s;
}
.pbtn:active{transform:scale(.97)}
.pbtn:disabled{background:var(--field);color:var(--muted);cursor:default}
.pbtn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--dark)}
.stage-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.stage-nav span{font-size:12.5px;font-weight:600;min-width:120px;text-align:center}
.stage-nav button{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.stage-nav button:disabled{opacity:.35;cursor:default}
@media(max-width:640px){.panel{grid-template-columns:1fr}.stage-nav{margin-left:0;width:100%}}

/* ================= phone ================= */
.phone-wrap{display:flex;justify-content:center}
.phone{
  width:390px;height:844px;flex:none;
  border-radius:56px;background:#0b0b0b;padding:10px;
  box-shadow:0 30px 70px rgba(5,19,26,.28),inset 0 0 0 2px #2a2a2a;
  position:relative;
}
.screen{
  width:100%;height:100%;border-radius:46px;overflow:hidden;
  background:var(--bg);position:relative;
}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;border-radius:20px;background:#000;z-index:20}
.sbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:15;
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 34px;
  font-size:15px;font-weight:600;
}
.sbar .ic{display:flex;align-items:center;gap:6px}
.screen.lock .sbar{color:#fff}
.screen:not(.lock) .sbar{background:linear-gradient(var(--bg) 72%,rgba(236,243,248,0))}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--dark);z-index:30;opacity:.9}
.screen.lock .homebar{background:#fff}

.app{position:absolute;inset:0;overflow-y:auto;padding:64px 16px 112px;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hdr .logo{height:22px;width:auto;fill:var(--dark)}
.hdr .right{display:flex;align-items:center;gap:10px}
.icbtn{width:38px;height:38px;border-radius:50%;background:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-light));color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.greet{font-size:22px;font-weight:600;line-height:1.25;margin-bottom:16px}

/* cards */
.card{background:#fff;border-radius:var(--radius);padding:18px 16px;margin-bottom:12px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card h2{font-size:18px;font-weight:600;line-height:1.25}
.card h3{font-size:15px;font-weight:600}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;border-radius:12px;padding:4px 9px;background:var(--accent-bg);color:var(--dark);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:14px;padding:5px 10px;background:var(--accent-bg);color:var(--dark);white-space:nowrap;flex:none}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.pill.ok i{background:var(--green)}
.pill.ok{background:#EAF7EF}

.left{background:var(--accent-bg);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.left .cap{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.left .cols{display:flex;gap:8px}
.left .col{flex:1;min-width:0}
.left .num{font-size:22px;font-weight:600;line-height:1;transition:transform .3s}
.left .num small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.left .lab{font-size:11.5px;color:var(--muted);margin-top:4px}
.left .col.bump .num{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.intake{font-size:13px;line-height:1.5;color:#3f5361}
.intake b{color:var(--dark);font-weight:600}

/* progress block */
.prog{margin-top:4px}
.segs{display:flex;gap:4px;margin-bottom:12px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segs i.on{background:var(--blue)}
.segs i.cur{background:linear-gradient(90deg,var(--blue),var(--blue-light))}
.stage-t{font-size:15px;font-weight:600;margin-bottom:4px}
.stage-d{font-size:13px;line-height:1.5;color:#3f5361}
.stage-d b{font-weight:600;color:var(--dark)}
.row-btns{display:flex;gap:8px;margin-top:12px}
.btn{
  border:0;border-radius:24px;padding:13px 18px;font-size:13.5px;font-weight:600;cursor:pointer;
  background:linear-gradient(90deg,var(--blue),var(--blue-light));color:#fff;
  transition:transform .12s;width:100%;
}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--accent-bg);color:var(--dark)}
.btn.white{background:#fff;color:var(--dark)}
.btn.sm{width:auto;padding:11px 16px;font-size:13px}

/* order block */
.order{
  margin-top:14px;border-radius:16px;padding:16px;
  background:linear-gradient(135deg,var(--blue),var(--blue-light));color:#fff;
}
.order h4{font-size:15px;font-weight:600;line-height:1.3;margin-bottom:6px}
.order p{font-size:12.5px;line-height:1.5;opacity:.95;margin-bottom:12px}

/* manager block */
.mgr{margin-top:14px;border-radius:16px;padding:14px;background:var(--accent-bg);display:flex;gap:12px}
.mgr .ava{flex:none;width:40px;height:40px;font-size:12px}
.mgr h4{font-size:13.5px;font-weight:600;margin-bottom:4px;line-height:1.3}
.mgr p{font-size:12.5px;line-height:1.5;color:#3f5361}
.mgr .links{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.lnk{background:none;border:0;padding:0;font-size:12.5px;font-weight:600;color:var(--blue);cursor:pointer}

/* analytics */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-head .lnk{font-size:12px}
.mk{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--field)}
.mk:first-of-type{border-top:0}
.mk .n{flex:1;min-width:0}
.mk .n b{display:block;font-size:13px;font-weight:600}
.mk .n span{font-size:11.5px;color:var(--muted)}
.mk .bar{width:76px;height:6px;border-radius:3px;background:var(--line);position:relative;flex:none}
.mk .bar i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.mk .bar i.low{background:#F2994A}
.mk .v{font-size:12px;font-weight:600;width:82px;text-align:right;flex:none;white-space:nowrap}

/* recs */
.rail{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.rc{flex:none;width:210px;background:#fff;border-radius:16px;padding:14px;scroll-snap-align:start}
.rc .ico{width:36px;height:36px;border-radius:12px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.rc b{display:block;font-size:13.5px;font-weight:600;margin-bottom:4px}
.rc p{font-size:12px;line-height:1.45;color:#3f5361}

/* tabbar */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:88px;z-index:12;
  background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:10px 10px 0;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--muted);background:none;border:0;cursor:pointer;width:70px}
.tab svg{stroke:var(--muted)}
.tab.on{color:var(--blue)}
.tab.on svg{stroke:var(--blue)}

/* ================= lock screen ================= */
.lock{
  position:absolute;inset:0;
  background:radial-gradient(120% 70% at 30% 0%,#1B5E86 0%,#0B2A3C 45%,#05131A 100%);
  color:#fff;display:flex;flex-direction:column;align-items:center;
  padding:92px 18px 60px;
}
.lock .date{font-size:16px;font-weight:500;opacity:.9}
.lock .time{font-size:82px;font-weight:500;letter-spacing:-1px;line-height:1.05;margin-bottom:30px}
.notif{
  width:100%;border-radius:22px;padding:12px 14px;
  background:rgba(255,255,255,.9);color:var(--dark);
  display:flex;gap:12px;cursor:pointer;
  box-shadow:0 8px 28px rgba(0,0,0,.25);
  transform:translateY(-14px);opacity:0;animation:drop .45s .15s ease forwards;
}
@keyframes drop{to{transform:none;opacity:1}}
.notif .appic{flex:none;width:40px;height:40px;border-radius:11px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.notif .body{flex:1;min-width:0}
.notif .l1{display:flex;justify-content:space-between;font-size:11.5px;color:#5c6d78;margin-bottom:2px}
.notif .l1 b{font-weight:600;color:var(--dark)}
.notif .t{font-size:13px;font-weight:600;line-height:1.3}
.notif .d{font-size:12.5px;line-height:1.4;color:#3f5361;margin-top:2px}
.lock .hint{margin-top:auto;font-size:12.5px;opacity:.75;background:none;border:0;color:#fff;cursor:pointer;padding:10px}
.lock .flash{position:absolute;bottom:88px;left:0;right:0;display:flex;justify-content:space-between;padding:0 46px}
.lock .flash span{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}

/* ================= sheet ================= */
.dim{position:absolute;inset:0;background:rgba(5,19,26,.45);z-index:40;opacity:0;transition:opacity .25s}
.dim.show{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;
  background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 36px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-height:92%;overflow-y:auto;
}
.sheet.show{transform:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.step-cap{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.sheet h3{font-size:19px;font-weight:600;line-height:1.25;margin-bottom:8px}
.sheet p{font-size:13.5px;line-height:1.5;color:#3f5361;margin-bottom:16px}
.sheet .row-btns{margin-top:8px}
.addr{display:flex;gap:12px;align-items:flex-start;background:var(--accent-bg);border-radius:14px;padding:14px;margin-bottom:16px}
.addr .txt b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
.addr .txt span{font-size:12.5px;color:#3f5361;line-height:1.4}
.ta{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.45;resize:none;height:84px;outline:none;margin-bottom:12px}
.ta:focus{border-color:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.chips-cap{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.done-ic{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-light));display:flex;align-items:center;justify-content:center;margin:6px 0 16px}
.sum{border-radius:14px;background:var(--accent-bg);padding:4px 14px;margin-bottom:18px}
.sum div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:9px 0;border-top:1px solid #fff}
.sum div:first-child{border-top:0}
.sum span{color:var(--muted)}
.sum b{font-weight:600;text-align:right}

/* ================= form (stub) ================= */
.form{position:absolute;inset:0;background:var(--bg);z-index:45;overflow-y:auto;padding:64px 16px 40px;scrollbar-width:none}
.form .fh{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.form .fh h2{font-size:20px;font-weight:600}
.fld{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.fld label{font-size:13px;font-weight:500}
.fld input{border:0;text-align:right;font-size:13.5px;font-weight:600;width:110px;outline:none}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(18px)}
.fld.col{flex-direction:column;align-items:stretch}
.fld.col textarea{border:0;outline:none;font-size:13.5px;line-height:1.45;resize:none;height:70px;margin-top:6px}

.toast{
  position:absolute;left:14px;right:14px;bottom:100px;z-index:50;
  background:var(--dark);color:#fff;border-radius:16px;padding:12px 16px;
  font-size:12.5px;font-weight:500;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:none}
</style>
</head>

<script>
/* ================= data ================= */
const TARIFFS = {
  '6':    {name:'PRO 6 месяцев',  chip:'6 месяцев',  complexes:2, checkups:1, consults:1, cycles:2, chk:[1]},
  '12-2': {name:'PRO 12 месяцев', chip:'12 месяцев', complexes:4, checkups:2, consults:2, cycles:4, chk:[1,3]},
  '12-4': {name:'PRO 12 месяцев', chip:'12 месяцев', complexes:4, checkups:4, consults:4, cycles:4, chk:[1,2,3,4]},
};
const ADDR0 = 'Москва, ул. Большая Дмитровка, 12, кв. 45';
const DATES = ['3 октября','4 октября','6 октября'];
const TIMES = ['8:00–10:00','10:00–12:00'];

const S = {
  tariff:'12-2', cycle:2, checkup:0, launch:'client',
  pushed:false, launched:false, stage:-1,
  screen:'home', sheet:null, sheetMode:'full', step:0, editAddr:false,
  addr:ADDR0, anketa:'без изменений', date:null, time:null, dSel:0, tSel:0,
  form:{meds:false, preg:false},
  bump:false,
};

function tariff(){ return TARIFFS[S.tariff]; }
function defaultCheckup(){ return tariff().chk.includes(S.cycle) ? 1 : 0; }
function usedCheckupsBefore(){ return tariff().chk.filter(c => c < S.cycle).length; }
function counters(){
  const t = tariff();
  const done = S.launched ? 1 : 0;
  const chkUsed = usedCheckupsBefore() + (S.launched && S.checkup ? 1 : 0);
  return {
    complexes:[Math.max(0, t.complexes - (S.cycle - 1) - done), t.complexes],
    checkups:[Math.max(0, t.checkups - chkUsed), t.checkups],
    consults:[Math.max(0, t.consults - chkUsed), t.consults],
  };
}
function checkupsLeftBeforeLaunch(){ return tariff().checkups - usedCheckupsBefore(); }

function stages(){
  const n = S.cycle;
  const prod = {t:'Идёт производство комплекса', d:`Собираем комплекс №${n} по вашей формуле. Обычно это занимает две-три недели, затем передадим курьеру.`};
  const ask  = {t:'Уже получили заказ?', d:'Курьер отметил доставку. Подтвердите, что комплекс у вас, и мы начнём отсчёт нового приёма.', kind:'ask'};
  if (!S.checkup) return [
    prod,
    {t:'Комплекс готов и едет к вам', d:`Курьер привезёт заказ по адресу <b>${S.addr}</b>. Ожидаем доставку 20–24 октября.`},
    ask,
    {t:'Приём', d:`Комплекс №${n}, по две капсулы утром во время еды. Хватит до 22 января.`, ok:true},
  ];
  const when = S.date ? `Медсестра приедет <b>${S.date}, ${S.time}</b>. За 12 часов до забора не ешьте, воду пить можно.`
                      : 'Алина свяжется с вами, чтобы согласовать дату. За 12 часов до забора не ешьте, воду пить можно.';
  return [
    {t:'Ожидайте забора крови', d:when},
    {t:'Готовятся результаты', d:'Лаборатория обрабатывает пробы, обычно это занимает три-пять дней. Результаты появятся в разделе «Анализы».'},
    {t:'Готовим формулу', d:`Врач изучает результаты и подбирает состав комплекса №${n} под ваши текущие показатели.`},
    {t:'Консультация с врачом', d:'Мария Орлова, врач-нутрициолог. <b>14 октября в 18:00</b>, видеозвонок в приложении.'},
    prod,
    {t:'Комплекс готов и едет к вам', d:`Курьер привезёт заказ по адресу <b>${S.addr}</b>. Ожидаем доставку 10–14 ноября.`},
    ask,
    {t:'Приём', d:`Комплекс №${n}, по две капсулы утром во время еды. Хватит до 12 февраля.`, ok:true},
  ];
}

let scrollPos = 0;

function sbar(){
  return `<div class="island"></div>
  <div class="sbar"><span>9:41</span><span class="ic">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>

}

function render(){
  screen.className = 'screen' + (S.screen === 'lock' ? ' lock' : '');
  let html = sbar();
  if (S.screen === 'lock') html += renderLock();
  else {
    html += renderHome();
    if (S.screen === 'form') html += renderForm();
    if (S.sheet) html += `<div class="dim" id="dim"></div><div class="sheet" id="sheet">${renderSheet()}</div>`;
  }
  html += `<div class="toast" id="toast"></div><div class="homebar"></div>`;
  screen.innerHTML = html;
  const app = screen.querySelector('.app');
  if (app) app.scrollTop = scrollPos;
  if (S.sheet) requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('dim').classList.add('show');
    document.getElementById('sheet').classList.add('show');
  }));
  if (S.bump){ S.bump = false; }
  renderPanel();
}

function renderHome(){
  const t = tariff(), c = counters();
  const st = S.launched ? stages() : null;
  const cur = st ? st[S.stage] : null;
  const isIntake = !S.launched || (cur && cur.ok);
  const pill = isIntake ? `<span class="pill ok"><i></i>Приём</span>` : `<span class="pill"><i></i>Комплекс №${S.cycle} в работе</span>`;

  let body = '';
  if (!S.launched){
    body += `<p class="intake">Комплекс №${S.cycle - 1}, по две капсулы утром во время еды. Хватит до <b>24 октября</b>.</p>`;
    if (S.pushed) body += `
      <div class="order">
        <h4>Пора заказать следующий комплекс</h4>
        <p>Производство и доставка занимают около месяца. Закажите сейчас, чтобы продолжить приём без перерыва.</p>
        <button class="btn white" data-act="openOrder">Заказать</button>
      </div>`;
  } else {
    const n = st.length;
    body += `<div class="prog"><div class="segs">${st.map((_, i) => `<i class="${i < S.stage ? 'on' : i === S.stage ? 'cur' : ''}"></i>`).join('')}</div>
      <div class="stage-t">${cur.t}</div><div class="stage-d">${cur.d}</div>`;
    if (cur.kind === 'ask') body += `<div class="row-btns"><button class="btn" data-act="gotIt">Да, получила</button><button class="btn sec" data-act="notYet">Ещё нет</button></div>`;
    body += `</div>`;
    if (S.launch === 'manager' && !cur.ok) body += `
      <div class="mgr"><div class="ava">АК</div><div>
        <h4>Ваш менеджер Алина запустила следующий цикл</h4>
        <p>Комплекс №${S.cycle} уже в работе. Доставим по адресу: ${S.addr}.</p>
        <div class="links"><button class="lnk" data-act="editAddr">Изменить адрес</button>${S.checkup && !S.date ? `<button class="lnk" data-act="pickDate">Выбрать дату забора крови</button>` : ''}</div>
      </div></div>`;
  }

  const bump = S.bump ? ' bump' : '';
  return `<div class="app">
    <div class="hdr"><svg class="logo" viewBox="0 0 299.6 82.4"><use href="#wm"/></svg>
      <div class="right"><button class="icbtn">${I.bell}</button><div class="ava">АС</div></div></div>
    <div class="greet">Добрый день, Анна</div>

    <div class="card">
      <div class="card-top"><div><h2>Программа PRO</h2><div style="margin-top:6px"><span class="chip">${t.chip}${S.tariff === '12-2' ? ', 2 чекапа' : S.tariff === '12-4' ? ', 4 чекапа' : ''}</span></div></div>${pill}</div>
      <div class="left"><div class="cap">Осталось по программе</div><div class="cols">
        <div class="col${bump}"><div class="num">${c.complexes[0]}<small>из ${c.complexes[1]}</small></div><div class="lab">Комплексов</div></div>
        <div class="col${bump}"><div class="num">${c.checkups[0]}<small>из ${c.checkups[1]}</small></div><div class="lab">Чекапов</div></div>
        <div class="col${bump}"><div class="num">${c.consults[0]}<small>из ${c.consults[1]}</small></div><div class="lab">Консультаций</div></div>
      </div></div>
      ${body}
    </div>

    <div class="card">
      <div class="sec-head"><h3>Показатели</h3><button class="lnk">Все анализы</button></div>
      <div class="mk"><div class="n"><b>Витамин D</b><span>Чекап от 3 июля</span></div><div class="bar"><i style="left:58%"></i></div><div class="v">46 нг/мл</div></div>
      <div class="mk"><div class="n"><b>Ферритин</b><span>Растёт после первого цикла</span></div><div class="bar"><i class="low" style="left:22%"></i></div><div class="v">28 мкг/л</div></div>
      <div class="mk"><div class="n"><b>Магний</b><span>В норме</span></div><div class="bar"><i style="left:64%"></i></div><div class="v">0,89 ммоль/л</div></div>
    </div>

    <div class="sec-head" style="padding:4px 2px 0"><h3>Рекомендации</h3></div>
    <div class="rail">
      <div class="rc"><div class="ico">${I.moon}</div><b>Сон до 23:00</b><p>Магний из комплекса лучше усваивается при регулярном режиме сна.</p></div>
      <div class="rc"><div class="ico">${I.fish}</div><b>Рыба дважды в неделю</b><p>Омега-3 из еды поддержит ферритин, который у вас растёт.</p></div>
      <div class="rc"><div class="ico">${I.sun}</div><b>20 минут на солнце</b><p>Витамин D держится в норме, прогулки днём помогут его сохранить.</p></div>
    </div>
  </div>
  <div class="tabbar">
    <button class="tab on">${tabIcon.home}Главная</button>
    <button class="tab">${tabIcon.lab}Анализы</button>
    <button class="tab">${tabIcon.prog}Программа</button>
    <button class="tab">${tabIcon.prof}Профиль</button>
  </div>`;
}

function renderLock(){
  return `<div class="lock">
    <div class="date">Четверг, 24 сентября</div>
    <div class="time">9:41</div>
    <div class="notif" data-act="openPush">
      <div class="appic">${I.sign}</div>
      <div class="body">
        <div class="l1"><b>Bioniq</b><span>сейчас</span></div>
        <div class="t">Пора заказать следующий комплекс</div>
        <div class="d">Витаминов хватит ещё на месяц. Производство и доставка занимают столько же, поэтому лучше заказать сейчас.</div>
      </div>
    </div>
    <div class="flash"><span>${I.torch}</span><span>${I.cam}</span></div>
    <button class="hint" data-act="unlock">Смахните вверх, чтобы открыть</button>
  </div>`;
}

function sheetSteps(){
  if (S.sheetMode === 'addr') return ['address'];
  if (S.sheetMode === 'blood') return ['blood'];
  const s = ['anketa','address'];
  if (S.checkup) s.push('blood');
  s.push('done');
  return s;
}

function renderSheet(){
  const steps = sheetSteps();
  const step = steps[S.step];
  const total = steps.length - (steps.includes('done') ? 1 : 0);
  const cap = S.sheetMode === 'full' && step !== 'done' ? `<div class="step-cap">Шаг ${S.step + 1} из ${total}</div>` : '';
  let h = `<div class="handle"></div>${cap}`;
  if (step === 'anketa'){
    h += `<h3>Что-то изменилось в анкете здоровья?</h3>
      <p>Новые диагнозы, лекарства, беременность или самочувствие. Врач учтёт это, когда будет собирать формулу.</p>
      <button class="btn" data-act="anketaNo">Нет, всё как прежде</button>
      <div class="row-btns"><button class="btn sec" data-act="anketaYes">Да, обновить анкету</button></div>`;
  } else if (step === 'address'){
    h += `<h3>Подтвердите адрес доставки</h3>`;
    if (S.editAddr){
      h += `<p>Курьер привезёт комплекс сюда.</p>
        <textarea class="ta" id="addrIn">${S.addr}</textarea>
        <button class="btn" data-act="saveAddr">Сохранить адрес</button>`;
    } else {
      h += `<p>Курьер привезёт комплекс на прежний адрес.</p>
        <div class="addr">${I.pin}<div class="txt"><b>Дом</b><span>${S.addr}</span></div></div>
        <button class="btn" data-act="confirmAddr">Подтвердить</button>
        <div class="row-btns"><button class="btn sec" data-act="editAddrInline">Изменить</button></div>`;
    }
  } else if (step === 'blood'){
    h += `<h3>Запишитесь на забор крови</h3>
      <p>Медсестра приедет домой или в офис, процедура занимает около десяти минут.</p>
      <div class="chips-cap">Дата</div>
      <div class="chips">${DATES.map((d, i) => `<button class="${i === S.dSel ? 'on' : ''}" data-act="dSel" data-i="${i}">${d}</button>`).join('')}</div>
      <div class="chips-cap">Время</div>
      <div class="chips">${TIMES.map((d, i) => `<button class="${i === S.tSel ? 'on' : ''}" data-act="tSel" data-i="${i}">${d}</button>`).join('')}</div>
      <button class="btn" data-act="book">Записаться на ${DATES[S.dSel]}</button>`;
  } else if (step === 'done'){
    h += `<div class="done-ic">${I.check}</div>
      <h3>Комплекс №${S.cycle} в работе</h3>
      <p>${S.checkup ? 'Сначала обновим анализы, затем врач соберёт формулу и мы запустим производство.' : 'Запускаем производство по вашей формуле. Комплекс приедет примерно через месяц.'}</p>
      <div class="sum">
        <div><span>Анкета</span><b>${S.anketa}</b></div>
        <div><span>Адрес</span><b>${S.addr}</b></div>
        ${S.checkup ? `<div><span>Забор крови</span><b>${S.date}, ${S.time}</b></div>` : ''}
      </div>
      <button class="btn" data-act="finish">Вернуться на главную</button>`;
  }
  return h;
}

function renderForm(){
  return `<div class="form">
    <div class="fh"><button class="icbtn" data-act="formBack">${I.back}</button><h2>Анкета здоровья</h2></div>
    <div class="fld"><label>Вес</label><input value="58 кг"></div>
    <div class="fld"><label>Принимаю лекарства</label><button class="sw ${S.form.meds ? 'on' : ''}" data-act="swMeds"></button></div>
    <div class="fld"><label>Беременность или кормление</label><button class="sw ${S.form.preg ? 'on' : ''}" data-act="swPreg"></button></div>
    <div class="fld"><label>Аллергии</label><input value="Нет"></div>
    <div class="fld col"><label>Что изменилось за последние месяцы</label><textarea placeholder="Самочувствие, сон, питание, новые диагнозы"></textarea></div>
    <div style="margin-top:14px"><button class="btn" data-act="formSave">Сохранить</button></div>
  </div>`;
}

/* ================= panel ================= */
function renderPanel(){
  document.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.key;
    seg.querySelectorAll('button').forEach(b => {
      b.classList.toggle('on', String(S[key]) === b.dataset.v);
      if (key === 'cycle') b.disabled = Number(b.dataset.v) > tariff().cycles;
      if (key === 'checkup') b.disabled = (b.dataset.v === '1' && checkupsLeftBeforeLaunch() === 0);
    });
  });
  document.getElementById('hintCycle').textContent = tariff().cycles === 2 ? 'В тарифе на 6 месяцев два комплекса, второй и последний' : '';
  document.getElementById('hintChk').textContent = checkupsLeftBeforeLaunch() === 0 ? 'Чекапы по тарифу уже использованы' : (defaultCheckup() ? 'По плану тарифа в этом цикле чекап' : 'По плану тарифа в этом цикле чекапа нет');
  const push = document.getElementById('btnPush');
  push.hidden = S.launch === 'manager' || S.launched;
  push.disabled = S.pushed;
  push.textContent = S.pushed ? 'Пуш отправлен, повторно не беспокоим' : 'Прислать пуш за месяц до конца';
  const nav = document.getElementById('stageNav');
  nav.hidden = !S.launched;
  if (S.launched){
    const st = stages();
    document.getElementById('stLabel').textContent = `Этап ${S.stage + 1} из ${st.length}`;
    document.getElementById('stPrev').disabled = S.stage === 0;
    document.getElementById('stNext').disabled = S.stage === st.length - 1;
  }
}

function resetFlow(){
  Object.assign(S, {pushed:false, launched:false, stage:-1, screen:'home', sheet:null, sheetMode:'full', step:0, editAddr:false, addr:ADDR0, anketa:'без изменений', date:null, time:null, dSel:0, tSel:0, form:{meds:false, preg:false}});
  if (S.launch === 'manager'){ S.launched = true; S.stage = 0; }
  scrollPos = 0;
}

document.getElementById('panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const seg = b.closest('.seg');
  if (seg){
    const key = seg.dataset.key, v = b.dataset.v;
    if (key === 'tariff'){ S.tariff = v; if (S.cycle > tariff().cycles) S.cycle = 2; S.checkup = defaultCheckup(); }
    else if (key === 'cycle'){ S.cycle = Number(v); S.checkup = defaultCheckup(); }
    else if (key === 'checkup'){ S.checkup = Number(v); }
    else if (key === 'launch'){ S.launch = v; }
    if (checkupsLeftBeforeLaunch() === 0) S.checkup = 0;
    resetFlow(); render(); return;
  }
  if (b.id === 'btnPush'){ S.pushed = true; S.screen = 'lock'; render(); }
  if (b.id === 'btnReset'){ resetFlow(); render(); }
  if (b.id === 'stPrev'){ S.stage = Math.max(0, S.stage - 1); render(); }
  if (b.id === 'stNext'){ S.stage = Math.min(stages().length - 1, S.stage + 1); render(); }
});

/* ================= phone actions ================= */
function toast(msg){
  const t = document.getElementById('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function closeSheet(){
  const d = document.getElementById('dim'), s = document.getElementById('sheet');
  if (d) d.classList.remove('show'); if (s) s.classList.remove('show');
  setTimeout(() => { S.sheet = null; S.step = 0; S.editAddr = false; render(); }, 260);
}
function next(){
  const steps = sheetSteps();
  if (S.step < steps.length - 1){ S.step++; S.editAddr = false; render(); }
  else closeSheet();
}

screen.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const app = screen.querySelector('.app'); if (app) scrollPos = app.scrollTop;
  const a = el.dataset.act;
  switch (a){
    case 'openPush': S.screen = 'home'; scrollPos = 0; render(); setTimeout(() => { S.sheet = true; S.sheetMode = 'full'; S.step = 0; render(); }, 350); break;
    case 'unlock': S.screen = 'home'; scrollPos = 0; render(); break;
    case 'openOrder': S.sheet = true; S.sheetMode = 'full'; S.step = 0; render(); break;
    case 'anketaNo': S.anketa = 'без изменений'; next(); break;
    case 'anketaYes': S.screen = 'form'; render(); break;
    case 'formBack': S.screen = 'home'; render(); break;
    case 'formSave': S.anketa = 'обновлена'; S.screen = 'home'; next(); break;
    case 'swMeds': S.form.meds = !S.form.meds; render(); break;
    case 'swPreg': S.form.preg = !S.form.preg; render(); break;
    case 'editAddrInline': S.editAddr = true; render(); break;
    case 'saveAddr': { const v = document.getElementById('addrIn').value.trim(); if (v) S.addr = v; S.editAddr = false; if (S.sheetMode === 'addr'){ closeSheet(); setTimeout(() => toast('Адрес обновили, менеджер увидит его в заказе'), 320); } else next(); break; }
    case 'confirmAddr': next(); break;
    case 'dSel': S.dSel = Number(el.dataset.i); render(); break;
    case 'tSel': S.tSel = Number(el.dataset.i); render(); break;
    case 'book': S.date = DATES[S.dSel]; S.time = TIMES[S.tSel]; if (S.sheetMode === 'blood'){ closeSheet(); setTimeout(() => toast(`Записали на ${S.date}, ${S.time}`), 320); } else next(); break;
    case 'finish': S.launched = true; S.stage = 0; S.bump = true; closeSheet(); break;
    case 'gotIt': S.stage = stages().length - 1; render(); break;
    case 'notYet': toast('Хорошо, спросим позже'); break;
    case 'editAddr': S.sheet = true; S.sheetMode = 'addr'; S.step = 0; S.editAddr = true; render(); break;
    case 'pickDate': S.sheet = true; S.sheetMode = 'blood'; S.step = 0; render(); break;
  }
});

S.checkup = defaultCheckup();
render();
</script>
</body>
</html>
